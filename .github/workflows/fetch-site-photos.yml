# One-shot: downloads the generated photographs into public/img/ as WebP
# (1x and 2x), then deletes itself in the same commit.
name: fetch-site-photos
on:
  push:
    branches: [ccr-997ae5f9-0bs3qr]
    paths: [.github/workflows/fetch-site-photos.yml]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq webp
      - name: Download and convert
        run: |
          set -euo pipefail
          mkdir -p public/img/states /tmp/raw/states
          while read -r name w1 w2 url; do
            curl -sSfL --retry 3 -o /tmp/raw/$name.png "$url"
            cwebp -quiet -q 78 -resize $w1 0 /tmp/raw/$name.png -o public/img/$name.webp
            cwebp -quiet -q 70 -resize $w2 0 /tmp/raw/$name.png -o public/img/$name@2x.webp
          done <<'LIST'
